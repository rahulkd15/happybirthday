<style>
:root{--ink:#2a1020;--pink:#ff4fa0;--rose:#c8688e;--cream:#fdf6ee;--soft:#ffd6e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Space Mono","Courier New",monospace;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
background:linear-gradient(135deg,#fbd9e8 0%,#fde3ea 45%,#fde2c4 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.7;animation:drift 12s ease-in-out infinite alternate;z-index:0}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.2)}}
.fh{position:fixed;color:#fff;opacity:.55;z-index:0;animation:fl 9s ease-in-out infinite alternate;pointer-events:none}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;padding:16px}
.win{width:min(92vw,360px);background:var(--cream);border:3px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--ink);position:relative;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.win.out{animation:outa .35s forwards}@keyframes outa{to{transform:scale(.9);opacity:0}}
.tb{height:40px;background:var(--pink);border-bottom:3px solid var(--ink);display:flex;align-items:center;padding:0 12px;gap:6px;font-weight:700;letter-spacing:2px;font-size:13px;color:var(--ink)}
.tb i{width:14px;height:14px;border:2px solid var(--ink);background:#fff;display:block}
.tb span{margin-left:auto}
.tb.seal{background:var(--rose)}
.scr{position:absolute;width:6px;height:6px;border:1.5px solid var(--ink);border-radius:50%;opacity:.6}
.pad{padding:26px 20px 30px;text-align:center;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
h2{margin:0;color:var(--pink);font-size:25px;line-height:1.25;text-shadow:2px 2px 0 #ffd0e4}
p.s{margin:0;font-size:12px;font-weight:700}
.btn{font:700 13px "Space Mono",monospace;letter-spacing:1px;background:var(--pink);color:#fff;border:3px solid var(--ink);padding:11px 20px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;text-transform:uppercase}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
/* curtain */
.curtain{height:400px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#7a2246 0 14px,#a03a63 14px 28px,#6a1c3c 28px 42px,#8e2f55 42px 56px)}
.curtain:before{content:"";position:absolute;inset:0 0 auto 0;height:60px;background:linear-gradient(#0006,transparent);border-bottom:3px solid #e0a83a;border-radius:0 0 50% 50%/0 0 26px 26px}
.rope{position:absolute;left:50%;top:60px;bottom:0;width:6px;margin-left:-3px;background:linear-gradient(90deg,#b8862a,#f3cd6b,#b8862a)}
.knob{position:absolute;left:50%;top:70px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe89a,#b8862a);z-index:3}
#hold{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f38bb4,#c8688e);border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);color:var(--ink);font:700 9px "Space Mono",monospace;letter-spacing:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;cursor:pointer;touch-action:none;animation:beat 1.5s infinite}
#hold b{font-size:28px;line-height:1}
#hold.on{animation:shk .1s infinite}
@keyframes beat{50%{transform:scale(1.07)}}@keyframes shk{25%{transform:translate(2px,1px)}75%{transform:translate(-2px,-1px)}}
#rg{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:3;transform:rotate(-90deg);pointer-events:none}
#rg circle{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:440;stroke-dashoffset:440;stroke-linecap:round;opacity:.9}
.tag{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);white-space:nowrap;background:#f7dfe6cc;border:2px solid var(--ink);padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:1px}
.win.open .curtain{animation:none}
.curtain.op:before{opacity:0}
.curtain.op{background:var(--cream)}
.cl,.cr{position:absolute;top:0;bottom:0;width:50%;background:inherit;z-index:5;transition:transform 1s ease-in}
/* countdown */
.num{font-size:110px;font-weight:700;color:var(--rose);text-shadow:5px 5px 0 #ecc5d5;line-height:1;animation:pop .4s}
.dots{display:flex;gap:9px}.dots i{width:12px;height:12px;border-radius:50%;background:#efc3d3}.dots i.a{background:var(--rose)}
.kitty{font-size:70px;animation:fly 1.4s ease-in-out infinite alternate}
@keyframes fly{to{transform:translateY(-14px) rotate(6deg)}}
.cat{font-size:64px;animation:beat 1.5s infinite}
/* cake */
#cakebox{position:relative;width:230px;height:220px;touch-action:none;cursor:crosshair}
.cakepart{position:absolute;inset:0;font-size:150px;display:flex;align-items:center;justify-content:center;transition:transform .8s}
#slash{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.pct{width:52px;height:52px;border:4px solid var(--pink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;background:#fff}
/* gallery */
.car{position:relative;width:100%;height:270px;touch-action:pan-y;overflow:hidden}
.pol{position:absolute;left:50%;top:6px;width:170px;background:#fff;border:3px solid var(--ink);padding:8px 8px 6px;box-shadow:4px 4px 0 #0003;transition:transform .45s,opacity .45s;text-align:center;font-size:9px;font-weight:700}
.ph{height:190px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:52px;background-size:cover;background-position:center;cursor:pointer}
.pd{display:flex;gap:6px}.pd i{width:9px;height:9px;background:#c9c0b8;display:block}.pd i.a{background:var(--pink)}
/* letter */
.env{width:210px;height:130px;background:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:1px}
.wxw{position:relative;width:60px;height:60px;margin-top:-6px}.wbk{position:absolute;inset:-16px;border:5px solid #ffcfe1;border-radius:16px;transform:rotate(-9deg);opacity:.75;animation:wob 2.4s ease-in-out infinite alternate}@keyframes wob{to{transform:rotate(-2deg) scale(1.05)}}.wax{position:relative;width:60px;height:60px;border-radius:50%;background:#ffb6d2;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;animation:beat 1.4s infinite}.wax b{color:#ff4fa0;font-size:26px;line-height:1;margin-top:1px}.cur{color:var(--pink);animation:bl .7s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.ln{display:flex;align-items:center;gap:8px;width:170px;font-size:12px;color:var(--pink)}.ln:before,.ln:after{content:"";flex:1;height:2px;background:var(--ink)}
/* message */
#ovl{position:fixed;inset:0;background:#2a10208c;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.mw{width:min(92vw,360px);background:var(--cream);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);animation:pop .4s}
.mw .tb{justify-content:space-between}.x{width:26px;height:26px;background:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
#mt{margin:14px;height:340px;border:3px solid var(--ink);background:#fffaf3;padding:12px;font-size:14px;font-weight:700;line-height:1.55;white-space:pre-wrap;overflow-y:auto;user-select:text}
.eb{display:block;margin:0 auto 18px;padding:9px 22px;font-size:15px;letter-spacing:3px;line-height:1.1}

img.kitty{width:190px;height:auto;font-size:0;animation:fly 1.4s ease-in-out infinite alternate;pointer-events:none}
img.cat{width:210px;height:auto;font-size:0;animation:beat 1.8s infinite;pointer-events:none}
.cakepart img{width:215px;height:auto;pointer-events:none;-webkit-user-drag:none}
.win:has(.stk1){background:#f5f2e9}
.win:has(.stk2){background:#f8f4e9}
.win:has(.stk3){background:#fcf9f2}
.pct{position:relative;background:conic-gradient(var(--pink) calc(var(--p,0)*1%),#e3dcd6 0);border:0;width:56px;height:56px}
.pct:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#f5f2e9}
.pct span{position:relative}
#slash{filter:drop-shadow(0 0 5px #ff4fa0)}

.gp{width:100%;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 12px 16px;position:relative}
.gp:before{content:"";position:absolute;top:-13px;left:-16px;width:72px;height:22px;background:#ff9ec4cc;border:2px solid var(--ink);transform:rotate(-24deg)}
.gimg{height:270px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,#ffe3ee 0 10px,#fff1e2 10px 20px);background-size:cover;background-position:center}
.gp h2{margin:14px 0 2px;font-size:24px}
.pb{display:flex;gap:9px;justify-content:center}
.pb i{width:44px;height:50px;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;color:var(--pink)}
.pb.bad{animation:shk .08s 6}
.kp{display:grid;grid-template-columns:repeat(3,58px);gap:12px;justify-content:center;margin-top:4px}
.kp button{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);box-shadow:3px 3px 0 var(--ink);font:700 20px "Space Mono",monospace;color:var(--ink);cursor:pointer;padding:0}
.kp button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);background:var(--soft)}
.bk{font-size:12px;font-weight:700;text-decoration:underline;color:var(--ink);cursor:pointer;margin-top:4px}
canvas{position:fixed;inset:0;z-index:30;pointer-events:none}
.cr8{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:14px;font-size:11px;color:#8a6a78;z-index:1}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:25;font-size:20px;background:none;border:0;cursor:pointer}

function seal(){
 win('SEAL.EXE',`<div class="curtain" id="cu"><div class="rope"></div><div class="knob"></div><svg id="rg" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70"/></svg><div id="hold"><b>❤</b>HOLD ME</div><div class="tag">DON'T LET GO UNTIL IT OPENS!</div></div>`);

 function lp(){const p=Math.min((performance.now()-t0)/D,1);r.style.strokeDashoffset=440*(1-p);osc&&(osc.frequency.value=110+p*420);if(navigator.vibrate&&Math.random()<.08)navigator.vibrate(15);if(p>=1)return fin();raf=requestAnimationFrame(lp)}
 function stop(){try{osc&&osc.stop()}catch(_){}osc=null}
 function up(){if(done)return;cancelAnimationFrame(raf);b.classList.remove('on');stop();r.style.strokeDashoffset=440}
 function fin(){done=true;stop();b.classList.remove('on');chime();navigator.vibrate&&navigator.vibrate([80,40,160]);bgm();
  const cu=$('#cu');cu.style.transition='opacity .7s';cu.style.opacity=0;setTimeout(()=>countdown(3),650)}

}
